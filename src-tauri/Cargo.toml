[package]
name = "oviate"
version = "0.1.0"
description = "Oviate - fast keyboard-first charting tool"
authors = ["Oviate contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oviate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4.45"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "query", "form"] }
keyring = "4.2.0"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
roxmltree = "0.21.1"
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
regex = "1.13.1"


# Android has no system certificate verifier set up for rustls (it panics until a JNI hook is installed): use the bundled Mozilla roots there
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
